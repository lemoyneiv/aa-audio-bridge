name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare optional signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests, lint & build APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aa-audio-bridge-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          APK_NAME="car-audio-bridge-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
          (cd dist && sha256sum "${APK_NAME}" > SHA256SUMS)
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<EOF
          **Car Audio Bridge ${GITHUB_REF_NAME}** (\`aa-audio-bridge\`) — 100% offline Android companion app for **Pixel 8 + Wireless Android Auto** (and Hyundai Ioniq 5 / \`gen5w-suite\` head units) that pauses Android Auto music and routes **Marco Polo** & **Speechify** audio through your car speakers.

          ### Quick Pixel 8 Install
          1. Download **\`${APK_NAME}\`** below on your Pixel 8 and tap to install.
          2. Open **Car Audio Bridge** and complete the 1-minute setup card (Bluetooth/Notification permissions, Accessibility toggle — allowing *Restricted settings* in App Info \`⋮\` first if prompted — and Unrestricted battery).

          ### Checksums (\`SHA256SUMS\`)
          \`\`\`
          $(cat dist/SHA256SUMS)
          \`\`\`
          EOF
          sed -i 's/^          //' "$NOTES"
          gh release create "$GITHUB_REF_NAME" \
            --title "Car Audio Bridge ${GITHUB_REF_NAME}" \
            --notes-file "$NOTES" \
            "dist/${APK_NAME}" \
            dist/SHA256SUMS
